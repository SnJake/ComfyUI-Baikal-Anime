[project]
# Immutable Comfy Registry identity; public branding and repository have changed.
name = "snjake_baikal_swin_anime"
description = "Baikal anime and illustration upscalers for ComfyUI: LoopSR v2, LoopSR v1 and SwinFIR v31."
version = "2.1.0"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=0.26", "safetensors>=0.4"]
classifiers = ["Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows", "Environment :: GPU :: NVIDIA CUDA"]

[project.urls]
Repository = "https://github.com/SnJake/ComfyUI-Baikal-Anime"
Documentation = "https://github.com/SnJake/ComfyUI-Baikal-Anime#readme"
"Bug Tracker" = "https://github.com/SnJake/ComfyUI-Baikal-Anime/issues"

[tool.comfy]
PublisherId = "snjake"
DisplayName = "Baikal Anime Upscaler"
Icon = ""
includes = []
"requires-comfyui" = ">=1.0.0"
